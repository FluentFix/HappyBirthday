<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>♦ A Little Gift Awaits...</title>

    <link rel="icon"
    type="image/png"
    href="Amber.png">

    <link rel="stylesheet"
    href="style.css">

</head>


<body>

<div class="background-glow"></div>

<div class="card">

    <h1>A Little Gift Awaits...</h1>

    <p class="subtitle">

        Some gifts aren't meant for everyone.
        <br>
        This one was made especially for someone.

    </p>


    <div class="form-group">

        <label>
            First Name
        </label>

        <input

        type="text"

        id="name"

        placeholder="tim first name la po..."

        autocomplete="off"

        >

    </div>



    <div class="form-group">

        <label>
            Birth Date
        </label>

        <input

        type="date"

        id="birthday"

        >

    </div>



    <button

    onclick="checkLogin()"

    id="unlockButton"

    >

        UNLOCK

    </button>



    <p id="errorMessage"></p>


    <p class="footer-text">

        Only the birthday girl may enter.

    </p>


</div>


<script src="script.js"></script>

</body>

</html>
